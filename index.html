<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#3b6fd8" />
    <meta name="description" content="See the time for the people you care about, anywhere in the world." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Clocks" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>World Clock</title>
    <script>
      try {
        document.documentElement.dataset.theme = JSON.parse(localStorage.getItem('worldclock')).settings.theme || 'system';
      } catch (e) {
        document.documentElement.dataset.theme = 'system';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
